
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Alina | Haute Coiffure Montréal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                espresso: '#2A2420',  // Deep dark brown
                sand: '#D2C1B0',      // Soft taupe
                gold: '#AF944F',      // Muted gold accent
                cream: '#FDFBF7',     // Main background
                paper: '#F5F2ED',     // Slightly darker background
                text: '#443E3A',      // Muted espresso for body text
              }
            },
            fontFamily: {
              serif: ['Playfair Display', 'serif'],
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, .font-serif {
            font-family: 'Playfair Display', serif;
        }
        ::selection {
            background: #AF944F;
            color: #FDFBF7;
        }
        .luxury-border {
            border: 1px solid rgba(42, 36, 32, 0.1);
        }
        .gold-line {
            height: 1px;
            background: linear-gradient(to right, transparent, #AF944F, transparent);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
<body class="bg-brand-cream text-brand-espresso">
    <div id="root"></div>
</body>
</html>
